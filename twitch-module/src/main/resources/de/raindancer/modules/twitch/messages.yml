# Rain's Twitch — every line this module says. Offered as a floor: anything in an owner's own messages.yml wins.
twitch:
  usage: "<gray>/twitch status · /twitch test live|ended <dark_gray>(shows it to you only)</dark_gray> · /twitch test live|ended all [counts] <dark_gray>(tells the whole network; with counts it earns the advancements like a real stream)</dark_gray> · /twitch reload · /twitch login|logout <dark_gray>(console only)</dark_gray>"
  not-allowed: "<red>That is for staff."
  reloaded: "<green>The Twitch login was read again."
  status:
    watching: "<gray>Watching <white><channel></white>: <white><seen></white>."
    listening: "<gray>This server does not ask Twitch for <white><channel></white> (no login, or announcements are off) — it shows what a watching server tells it."
    elsewhere: "<gray>This server does not ask Twitch for <white><channel></white> — <white><server></white> does, and tells this one."
    login:
      environment: "<gray>Twitch login: present, from the environment variables."
      database: "<gray>Twitch login: present, from the network's secret store."
      none: "<yellow>Twitch login: none. From the console: /twitch login <client-id> <client-secret>, or set RAINS_TWITCH_CLIENT_ID and RAINS_TWITCH_CLIENT_SECRET."
  login:
    console-only: "<red>The Twitch login can only be set or removed from the server console: what you type in the game is written to the server log."
    usage: "<gray>/twitch login <client-id> <client-secret>"
    stored: "<green>The Twitch login was stored in the network's secret store."
    stored-environment-wins: "<yellow>The Twitch login was stored, but the environment variables are set and win over it."
    cleared: "<green>The stored Twitch login was removed."
    failed: "<red>The database could not be written; nothing was changed. See the server log."
  live:
    rule: "<gradient:#9146FF:#E0A8FF>━━━━━━━━━━━━━━ ✦ ━━━━━━━━━━━━━━</gradient>"
    head: "   <red><bold>●</bold></red> <gradient:#9146FF:#E0A8FF><bold>LIVE ON TWITCH</bold></gradient>"
    who: "   <white><bold><name></bold></white> <gray>just went live!"
    what: "   <gray>“<white><title></white>” <dark_gray>·</dark_gray> <light_purple><game>"
    what-title: "   <gray>“<white><title></white>”"
    what-game: "   <gray>Playing <light_purple><game>"
    watch: "   <gradient:#9146FF:#E0A8FF><underlined>▶ Watch now</underlined></gradient> <dark_gray>—</dark_gray> <gray>come say hi!"
  ended:
    rule: "<gradient:#5b5b6e:#9146FF>━━━━━━━━━━━━━━ ✦ ━━━━━━━━━━━━━━</gradient>"
    head: "   <dark_gray><bold>●</bold></dark_gray> <gradient:#9146FF:#E0A8FF><bold>STREAM ENDED</bold></gradient>"
    who: "   <white><bold><name></bold></white> <gray>was live for <white><lasted></white>."
    thanks: "   <gray>Thanks for watching! <light_purple>♥</light_purple> <dark_gray>—</dark_gray> <white>twitch.tv/<channel></white>"
live:
  usage: "<gray>/live <dark_gray>(on or off)</dark_gray> · /live on|off · /live link <channel url> · /live unlink · /live status · /live list <dark_gray>— staff add a player name: /live on <player>, /live link <player> <url></dark_gray>"
  disabled: "<red>Live mode is switched off on this server."
  not-creator: "<red>Live mode is for creators. Ask staff if you stream here."
  not-allowed: "<red>Only staff can switch live mode for somebody else."
  unknown-player: "<red>Nobody called <white><name></white> has been here."
  failed: "<red>That could not be saved; nothing was changed. Try again in a moment."
  on: "<green>You are live! <red>●</red> <gray>pulses next to your name now. <white>/live</white> again when you stop — it switches itself off after <white><hours></white> hours otherwise."
  on-other: "<green><white><name></white> is live now, by hand."
  off: "<gray>Live mode is off. Good stream!"
  off-other: "<gray><white><name></white> is no longer live."
  off-hidden: "<gray>Live mode is off — hidden for this stream only. Your next stream turns it on again by itself."
  off-hidden-other: "<gray><white><name></white>'s running stream is hidden; their next one shows again."
  link:
    bad: "<red>That is not a channel link. Paste it like <white>twitch.tv/yourname</white> or <white>youtube.com/@yourname</white>."
    done: "<green>Linked <white><channel></white>. <gray>When you go live on <platform>, your dot turns on by itself within a minute or two, and off when the stream ends."
    done-other: "<green>Linked <white><channel></white> to <white><name></white>."
    twitch-unwatched: "<yellow>Twitch is not being asked yet — staff have to set the Twitch login first (see /twitch status). Until then /live works by hand."
  unlink:
    done: "<gray>Your channel is unlinked; nothing about it is kept."
    done-other: "<gray><white><name></white>'s channel is unlinked."
    none: "<gray><white><name></white> has no channel linked."
  status:
    found: "<red>●</red> <white><name></white> <gray>is live on <white><platform></white> for <white><lasted></white>."
    by-hand: "<red>●</red> <white><name></white> <gray>is live (switched on by hand) for <white><lasted></white>."
    off: "<gray><white><name></white> is not live."
    channel: "<gray>Channel: <white><channel></white>"
    no-channel: "<gray>No channel linked. <white>/live link <channel url></white> turns live mode on and off by itself."
  list:
    none: "<gray>Nobody is live right now."
    head: "<red>●</red> <gray>Live right now (<white><count></white>):"
    line: "  <red>●</red> <white><name></white> <dark_gray>·</dark_gray> <gray><where></gray> <dark_gray>· <lasted>"
  announce:
    channel: "<red>●</red> <white><name></white> <gray>just went live on <white><platform></white>! <gradient:#FF3030:#FF8A8A><underlined>Watch</underlined></gradient>"
    plain: "<red>●</red> <white><name></white> <gray>is live now!"
